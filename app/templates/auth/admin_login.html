{% extends "base.html" %}

{% block title %}Admin login · IELTS Platform{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <p class="eyebrow">Administrator access</p>
            <h1>Log in as admin.</h1>
            <p>Use your administrator credentials to manage students and mock tests.</p>
        </div>
        <form class="auth-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ app_csrf_token }}">
            <div class="field">
                <label for="email">Admin email</label>
                <input id="email" name="email" type="text" autocomplete="username" value="{{ request.form.get('email', '') }}" placeholder="admin" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button button-full" type="submit">Enter admin panel <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch"><a href="{{ url_for('auth.login') }}">← Back to student login</a></p>
    </div>
</section>
{% endblock %}
