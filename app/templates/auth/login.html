{% extends "base.html" %}

{% block title %}Log in · IELTS Platform{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in to keep going.</h1>
            <p>Pick up your preparation right where you left off.</p>
        </div>
        <form class="auth-form" method="post">
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" value="{{ request.form.get('email', '') }}" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button button-full" type="submit">Log in <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create a free account</a></p>
    </div>
</section>
{% endblock %}
