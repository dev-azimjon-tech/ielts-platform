{% extends "base.html" %}

{% block title %}Create an account · IELTS Platform{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card auth-card-wide">
        <div class="auth-heading">
            <p class="eyebrow">Start for free</p>
            <h1>Create your account.</h1>
            <p>Set up your account and begin your IELTS preparation today.</p>
        </div>
        <form class="auth-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ app_csrf_token }}">
            <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" autocomplete="name" value="{{ request.form.get('name', '') }}" placeholder="Your name" required>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" value="{{ request.form.get('email', '') }}" placeholder="you@example.com" required>
            </div>
            <div class="form-row">
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8+ characters" required>
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm password</label>
                    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat password" required>
                </div>
            </div>
            <button class="button button-full" type="submit">Create account <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</section>
{% endblock %}
